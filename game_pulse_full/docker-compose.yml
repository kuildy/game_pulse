services:
  wavesig:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wavesig
    restart: unless-stopped
    env_file:
      - container.env
    environment:
      DATABASE_PATH: /app/data/game_pulse.db
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - ./data:/app/data
    mem_limit: 320m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s
